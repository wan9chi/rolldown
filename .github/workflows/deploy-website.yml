name: Deploy Website

permissions: {}

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - main
    # These inputs can affect the rendered site, so a change here is worth *checking*.
    # Replay: the fork doesn't deploy; this filter still decides which main pushes run.
    paths:
      - 'docs/**'
      - 'packages/rolldown/src/**'
      - 'packages/rolldown/package.json'
      - 'packages/rolldown/tsconfig*.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Builds/validates the docs. Runs untrusted PR code, so it has NO `environment`; its
  # `id-token` permission is for remote cache uploads (fork PRs get no OIDC token).
  # Replay: upstream's main-only Deploy to Void job and the content fingerprint that decides
  # whether it runs are removed; the fork has no Void project or secrets.
  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    permissions:
      # Remote cache uploads authenticate with a GitHub Actions OIDC token.
      id-token: write
    env:
      # Remote task cache, on when the repository variable is set. Pushes and pull requests from
      # this repository upload results; fork pull requests get no OIDC token and only download.
      # Replay: pull requests from fork/ branches stand in for fork pull requests.
      VP_REMOTE_CACHE_URL: ${{ vars.VP_REMOTE_CACHE_URL }}
      VP_REMOTE_CACHE: ${{ !vars.VP_REMOTE_CACHE_URL && 'off' || (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'fork/')) && 'read-write' || 'read' }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '0.0.0-commit.a37c40a3a57a4ab175a9e02fd99b774982578c1e'
          cache: true

      - name: Generate API reference
        run: vp run --filter rolldown-docs generate
        env:
          # Replay diagnostics: vp's debug traces show where the task's time goes, such as how
          # long its remote cache lookup waited. VP_* envs aren't fingerprinted.
          VP_LOG: vt=debug,vt_remote_cache=debug

      # Replay diagnostics: the full summary of the run, with the task's cache status.
      - if: ${{ !cancelled() }}
        run: vp run --last-details

      # Also on main, so pull requests can reuse main's cached build.
      - name: Build Docs
        run: vp run --filter rolldown-docs build
        env:
          VP_LOG: vt=debug,vt_remote_cache=debug

      - if: ${{ !cancelled() }}
        run: vp run --last-details

      # Replay check: hash what the cached tasks left, to compare with a fresh build at the end.
      - if: ${{ !cancelled() }}
        run: node .github/replay/outputs.mjs snapshot "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/cached-outputs"

      # Replay check: rebuild from a clean tree without the cache, and compare the outputs with the
      # cached run's. A difference in a task that hit is a false hit unless the file is
      # nondeterministic (known: assets/style.<hash>.css, the CSS hash in every .html,
      # .vitepress/cache/graphviz/manifest.json). These steps don't affect the job's result.
      - if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          VP_REMOTE_CACHE: 'off'
        run: |
          git checkout -- . && git clean -fdxq -e node_modules -e .vite-hooks
          vp run --no-cache --filter rolldown-docs generate
          vp run --no-cache --filter rolldown-docs build
      - if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node .github/replay/outputs.mjs snapshot "${{ runner.temp }}/fresh-outputs.json"
          node .github/replay/outputs.mjs compare "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/fresh-outputs.json" "${{ runner.temp }}/cached-outputs"
          node .github/replay/outputs.mjs collect "${{ runner.temp }}/cached-outputs.json" "${{ runner.temp }}/fresh-outputs.json" "${{ runner.temp }}/cached-outputs" "${{ runner.temp }}/replay-diff"
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-diff
          path: ${{ runner.temp }}/replay-diff
          if-no-files-found: ignore
          retention-days: 30
